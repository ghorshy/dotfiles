font_family         JetBrains Mono
bold_font           auto
italic_font         auto
bold_italic_font    auto
font_size           10.0
shell_integration   no-cursor
cursor_shape        block
cursor_trail        1
cursor_trail_decay  0.05 0.2

background_opacity  0.8

# colors are generated from .chezmoidata/theme.toml
include colors.conf
